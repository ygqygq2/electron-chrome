<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>electron-chrome 原型</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="flex min-h-screen flex-col">
      <header class="border-b border-white/10 bg-slate-900/95 backdrop-blur">
        <div class="flex items-center gap-3 px-4 pt-3">
          <div class="text-sm font-semibold tracking-wide text-sky-300">electron-chrome</div>
          <div class="flex min-w-0 flex-1 gap-2 overflow-x-auto pb-1">
            <div class="flex min-w-[200px] max-w-[240px] items-center gap-2 rounded-t-2xl border border-sky-400/30 bg-sky-500/20 px-3 py-2">
              <span class="h-2.5 w-2.5 rounded-full bg-sky-300"></span>
              <span class="truncate text-sm">Baidu</span>
              <button class="ml-auto text-slate-300">×</button>
            </div>
            <div class="flex min-w-[200px] max-w-[240px] items-center gap-2 rounded-t-2xl border border-white/10 bg-white/5 px-3 py-2">
              <span class="h-2.5 w-2.5 rounded-full bg-slate-500"></span>
              <span class="truncate text-sm">GitHub</span>
              <button class="ml-auto text-slate-400">×</button>
            </div>
          </div>
          <button class="h-9 w-9 rounded-xl border border-white/10 bg-white/5 text-xl">+</button>
        </div>
        <div class="flex items-center gap-3 px-4 py-3">
          <button class="h-10 w-10 rounded-xl border border-white/10 bg-white/5">←</button>
          <button class="h-10 w-10 rounded-xl border border-white/10 bg-white/5">→</button>
          <button class="h-10 w-10 rounded-xl border border-white/10 bg-white/5">↻</button>
          <div class="rounded-full border border-emerald-400/20 bg-emerald-400/10 px-4 py-2 text-xs text-emerald-300">当前标签 · www.baidu.com</div>
          <div class="flex flex-1 items-center rounded-xl border border-white/10 bg-slate-800/90 px-4 py-0">
            <span class="mr-3 text-slate-500">🔎</span>
            <input value="https://www.baidu.com/" class="h-10 flex-1 bg-transparent text-sm outline-none" />
          </div>
          <button class="h-10 rounded-xl bg-sky-600 px-5 text-sm font-semibold">打开</button>
          <div class="text-xs text-slate-400">已就绪</div>
        </div>
      </header>

      <main class="flex flex-1 flex-col bg-slate-950">
        <section class="grid flex-1 grid-cols-[1fr_420px] gap-0">
          <div class="relative border-r border-white/10 bg-white">
            <div class="absolute left-4 top-4 rounded-full bg-slate-900/80 px-3 py-1 text-xs text-white">页面承载区</div>
            <div class="flex h-full items-center justify-center text-slate-500">真实网页内容区 / WebContentsView</div>
          </div>
          <aside class="border-l border-white/10 bg-slate-900 p-6">
            <div class="mb-4 text-sm font-semibold text-sky-300">停靠式 DevTools</div>
            <div class="h-[calc(100%-2rem)] rounded-2xl border border-dashed border-white/15 bg-slate-950/60 p-4 text-sm text-slate-400">
              右侧停靠模式示意。后续用于验证：
              <ul class="mt-3 list-disc space-y-2 pl-5">
                <li>标签切换后 DevTools 绑定是否准确</li>
                <li>检查元素是否命中当前活动页</li>
                <li>底部 / 左侧 / 右侧停靠切换是否稳定</li>
              </ul>
            </div>
          </aside>
        </section>
      </main>
    </div>
  </body>
</html>
