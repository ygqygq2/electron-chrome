<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内置设置页仿浏览器改造</title>
    <style>
      :root {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1f2328;
        background: #f5f7fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f5f7fb; }
      .page { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
      .sidebar { padding: 18px 0; background: #fff; border-right: 1px solid #e5e9f0; }
      .logo { padding: 0 18px 14px; font-size: 34px; font-weight: 600; color: #717f92; }
      .search { margin: 0 18px 18px; }
      .search input { width: 100%; height: 34px; padding: 0 12px; border: 1px solid #d9e0ea; border-radius: 6px; background: #fbfcfe; }
      .nav { display: flex; flex-direction: column; gap: 2px; }
      .nav-item { padding: 10px 18px; color: #6b7785; font-size: 14px; }
      .nav-item.active { color: #fff; background: linear-gradient(180deg, #4f96ff 0%, #3c84f4 100%); }
      .content { padding: 18px 28px 48px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
      .topbar .searchbox { width: 180px; height: 32px; border: 1px solid #d9e0ea; border-radius: 4px; background: #fff; }
      .ghost-btn { height: 32px; padding: 0 14px; color: #5d6d80; background: #fff; border: 1px solid #d9e0ea; border-radius: 4px; }
      .section { max-width: 860px; margin-bottom: 34px; }
      .section h2 { margin: 0 0 14px; font-size: 18px; }
      .field { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; font-size: 14px; color: #607080; }
      .input { width: 420px; height: 34px; padding: 0 12px; background: #f8fbff; border: 1px solid #dce3ee; }
      .placeholder { width: 520px; min-height: 56px; border: 1px solid #e4e9f2; background: #f8fbff; }
      .muted { color: #8c99a8; font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="page">
      <aside class="sidebar">
        <div class="logo">选项</div>
        <div class="search"><input placeholder="搜索设置" /></div>
        <nav class="nav">
          <div class="nav-item active">基本设置</div>
          <div class="nav-item">界面设置</div>
          <div class="nav-item">标签设置</div>
          <div class="nav-item">下载设置</div>
          <div class="nav-item">鼠标手势</div>
          <div class="nav-item">快捷键</div>
          <div class="nav-item">实验室</div>
        </nav>
      </aside>
      <section class="content">
        <div class="topbar">
          <input class="searchbox" placeholder="搜索设置" />
          <button class="ghost-btn">恢复默认设置</button>
        </div>
        <section class="section">
          <h2>启动页面</h2>
          <div class="field"><input type="radio" checked /> 打开主页 <input class="input" value="https://hao.360.com" /></div>
          <div class="field muted">后续可在这里继续补“继续上次未关闭页面”“打开以下网页”等真实功能。</div>
          <div class="placeholder"></div>
        </section>
        <section class="section">
          <h2>搜索</h2>
          <div class="field">搜索引擎 <input class="input" value="360搜索" style="width: 180px" /></div>
          <div class="field"><input type="checkbox" checked /> 地址栏直接搜索</div>
          <div class="field"><input type="checkbox" checked /> 新标签页小文本框可直接搜索</div>
        </section>
        <section class="section">
          <h2>默认浏览器</h2>
          <div class="field"><input type="checkbox" /> 启动时检查是否为默认浏览器</div>
          <div class="field"><button class="ghost-btn">设为默认浏览器</button></div>
          <div class="field muted">当前默认浏览器：占位状态</div>
        </section>
      </section>
    </main>
  </body>
</html>
