<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; connect-src 'self' https: http:; font-src 'self' data:; object-src 'none'; base-uri 'self';"
    />
    <title>Electron Chrome</title>
  </head>
  <body>
    <div class="shell">
      <div class="tabbar">
        <div id="tabsHost" class="tabs-host">
          <div id="tabs" class="tabs"></div>
          <button id="addTabButton" class="tab-add" type="button" title="新建标签页" aria-label="新建标签页">
            <span class="toolbar-icon icon-add" aria-hidden="true"></span>
          </button>
        </div>

        <div class="window-controls top-window-controls">
          <button id="minimizeWindowButton" class="window-control-button" type="button" title="最小化" aria-label="最小化">
            <span class="toolbar-icon icon-minimize" aria-hidden="true"></span>
          </button>
          <button id="maximizeWindowButton" class="window-control-button" type="button" title="最大化" aria-label="最大化">
            <span class="toolbar-icon icon-maximize" aria-hidden="true"></span>
          </button>
          <button id="closeWindowButton" class="window-control-button close" type="button" title="关闭" aria-label="关闭">
            <span class="toolbar-icon icon-close" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div class="toolbar">
        <div class="nav-group">
          <button id="backButton" class="nav-button" type="button" title="后退" aria-label="后退">
            <span class="toolbar-icon icon-back" aria-hidden="true"></span>
          </button>
          <button id="forwardButton" class="nav-button" type="button" title="前进" aria-label="前进">
            <span class="toolbar-icon icon-forward" aria-hidden="true"></span>
          </button>
          <button id="reloadButton" class="nav-button" type="button" title="刷新" aria-label="刷新">
            <span class="toolbar-icon icon-reload" aria-hidden="true"></span>
          </button>
          <button id="homeButton" class="nav-button" type="button" title="首页" aria-label="首页">
            <span class="toolbar-icon icon-home" aria-hidden="true"></span>
          </button>
        </div>

        <div id="leftToolbarActions" class="toolbar-actions toolbar-actions-left"></div>

        <div class="address-shell">
          <span class="address-icon" aria-hidden="true"></span>
          <input id="urlInput" class="url-input" type="text" placeholder="输入网址，例如 https://www.baidu.com" />
        </div>

        <div class="toolbar-end">
          <div class="status-stack">
            <div id="statusText" class="status">准备中...</div>
          </div>

          <div id="rightToolbarActions" class="toolbar-actions toolbar-actions-right">
            <button id="restoreTabButton" class="toolbar-action-button" type="button" title="历史记录" aria-label="历史记录">
              <span class="toolbar-icon icon-history" aria-hidden="true"></span>
            </button>
            <button id="favoritesButton" class="toolbar-action-button" type="button" title="收藏夹" aria-label="收藏夹">
              <span class="toolbar-icon icon-favorites" aria-hidden="true"></span>
            </button>
            <button id="downloadsButton" class="toolbar-action-button" type="button" title="下载" aria-label="下载">
              <span class="toolbar-icon icon-downloads" aria-hidden="true"></span>
            </button>
            <button id="extensionsButton" class="toolbar-action-button" type="button" title="扩展" aria-label="扩展">
              <span class="toolbar-icon icon-extensions" aria-hidden="true"></span>
            </button>
          </div>

          <button id="appMenuButton" class="app-menu-button" type="button" title="菜单" aria-label="菜单">
            <span class="toolbar-icon icon-menu" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
