<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>electron-chrome 原型 v3</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-[#0f1115] text-slate-100">
    <div class="min-h-screen bg-[#0f1115]">
      <div class="border-b border-white/10 bg-[linear-gradient(180deg,#20262f_0%,#1a2028_100%)] px-2 py-1.5 shadow-[inset_0_1px_0_rgba(255,255,255,0.04)]">
        <div class="flex items-center gap-1.5 overflow-hidden">
          <div class="flex min-w-0 items-center gap-1.5 overflow-hidden">
            <div class="flex w-[220px] items-center gap-2 rounded-t-[2px] border border-[#4f5a66] border-b-[#171a20] bg-[#0f141a] px-3 py-2 text-sm text-slate-100">
              <span class="h-2 w-2 rounded-full bg-sky-400"></span>
              <span class="truncate">百度一下，你就知道</span>
              <button class="ml-auto h-5 w-5 rounded-full text-slate-300 hover:bg-white/10">×</button>
            </div>
            <div class="flex w-[184px] items-center gap-2 rounded-t-[2px] border border-[#3b434d] border-b-[#232a32] bg-[#262d35] px-3 py-2 text-sm text-slate-300">
              <span class="h-2 w-2 rounded-full bg-slate-500"></span>
              <span class="truncate">Example Domain with a very long page title...</span>
              <button class="ml-auto h-5 w-5 rounded-full text-slate-400 hover:bg-white/10">×</button>
            </div>
            <div class="flex w-[156px] items-center gap-2 rounded-t-[2px] border border-[#3b434d] border-b-[#232a32] bg-[#262d35] px-3 py-2 text-sm text-slate-300">
              <span class="h-2 w-2 rounded-full bg-slate-500"></span>
              <span class="truncate">Chrome 设置</span>
              <button class="ml-auto h-5 w-5 rounded-full text-slate-400 hover:bg-white/10">×</button>
            </div>
            <button class="inline-flex h-9 w-9 items-center justify-center rounded-[10px] border border-[#39424d] bg-[linear-gradient(180deg,#2c3540_0%,#232a33_100%)] text-lg font-semibold text-slate-100 shadow-[inset_0_1px_0_rgba(255,255,255,0.04)]">+</button>
          </div>
          <div class="ml-auto flex items-center gap-2 pl-3">
            <button class="inline-flex h-9 items-center justify-center rounded-[10px] border border-[#39424d] bg-[linear-gradient(180deg,#2c3540_0%,#232a33_100%)] px-4 text-sm font-semibold text-slate-100 shadow-[inset_0_1px_0_rgba(255,255,255,0.04)]">☰ 菜单</button>
          </div>
        </div>

        <div class="mt-2 flex items-center gap-2">
          <button class="inline-flex h-9 w-9 items-center justify-center rounded-[10px] border border-[#39424d] bg-[linear-gradient(180deg,#2c3540_0%,#232a33_100%)] text-sm text-slate-200 shadow-[inset_0_1px_0_rgba(255,255,255,0.04)]">←</button>
          <button class="inline-flex h-9 w-9 items-center justify-center rounded-[10px] border border-[#39424d] bg-[linear-gradient(180deg,#2c3540_0%,#232a33_100%)] text-sm text-slate-200 shadow-[inset_0_1px_0_rgba(255,255,255,0.04)]">→</button>
          <button class="inline-flex h-9 w-9 items-center justify-center rounded-[10px] border border-[#39424d] bg-[linear-gradient(180deg,#2c3540_0%,#232a33_100%)] text-sm text-slate-200 shadow-[inset_0_1px_0_rgba(255,255,255,0.04)]">↻</button>
          <div class="flex h-9 flex-1 items-center rounded-full border border-[#3a434f] bg-[linear-gradient(180deg,#11171f_0%,#0d1218_100%)] px-3 text-sm text-slate-300 shadow-[inset_0_1px_0_rgba(255,255,255,0.03)]">chrome://settings</div>
          <button class="inline-flex h-9 items-center justify-center rounded-[10px] border border-[#2f7ef6] bg-[linear-gradient(180deg,#2b7fff_0%,#1f6feb_100%)] px-4 text-sm font-semibold text-white shadow-[inset_0_1px_0_rgba(255,255,255,0.16)]">打开</button>
        </div>
      </div>

      <div class="mx-auto mt-8 max-w-5xl rounded-2xl border border-white/10 bg-[#171a20] p-8 shadow-2xl shadow-black/30">
        <div class="mb-8">
          <div class="text-xs uppercase tracking-[0.24em] text-sky-300/80">chrome://settings</div>
          <h1 class="mt-3 text-3xl font-semibold">设置</h1>
          <p class="mt-2 text-sm text-slate-400">在标签页中打开浏览器设置，保持和普通网页一致的切换体验。</p>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <section class="rounded-2xl border border-white/10 bg-white/5 p-5">
            <h2 class="text-base font-medium">浏览器壳</h2>
            <ul class="mt-3 space-y-2 text-sm text-slate-300">
              <li>• 新标签页默认打开首页</li>
              <li>• 多标签自动收缩，过多时隐藏超出标签</li>
              <li>• 应用菜单支持原生弹层</li>
            </ul>
          </section>
          <section class="rounded-2xl border border-white/10 bg-white/5 p-5">
            <h2 class="text-base font-medium">开发与诊断</h2>
            <ul class="mt-3 space-y-2 text-sm text-slate-300">
              <li>• F12 打开停靠式 DevTools</li>
              <li>• Ctrl/Cmd + T 新建标签页</li>
              <li>• Ctrl/Cmd + , 直接打开设置</li>
            </ul>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
