<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>electron-chrome 原型 v2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="min-h-screen bg-[radial-gradient(circle_at_top_left,rgba(59,130,246,0.22),transparent_32%),linear-gradient(180deg,#081120_0%,#0f172a_55%,#111827_100%)]">
      <div class="border-b border-white/10 bg-slate-950/70 px-4 py-3 backdrop-blur-xl">
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <div class="flex items-center gap-3 rounded-2xl border border-white/10 bg-white/5 px-4 py-2">
              <div class="h-3 w-3 rounded-full bg-sky-400 shadow-[0_0_18px_rgba(56,189,248,0.7)]"></div>
              <div>
                <div class="text-sm font-semibold tracking-wide">Electron Chrome</div>
                <div class="text-[11px] text-slate-400">Pure browser shell</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm hover:border-sky-400/40 hover:bg-sky-400/10">文件</button>
              <button class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm hover:border-sky-400/40 hover:bg-sky-400/10">导航</button>
              <button class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm hover:border-sky-400/40 hover:bg-sky-400/10">调试</button>
            </div>
          </div>
          <div class="flex items-center gap-2 text-xs">
            <span class="rounded-full border border-emerald-400/20 bg-emerald-400/10 px-3 py-1.5 text-emerald-300">Linux / WSL</span>
            <span class="rounded-full border border-sky-400/20 bg-sky-400/10 px-3 py-1.5 text-sky-300">GPU 自动</span>
            <span class="rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-slate-300">dbus 噪声已抑制</span>
          </div>
        </div>

        <div class="mt-4 flex items-center gap-3">
          <div class="flex min-w-0 flex-1 gap-2 overflow-x-auto">
            <div class="flex min-w-[220px] max-w-[260px] items-center gap-3 rounded-t-2xl border border-sky-400/35 bg-sky-500/15 px-4 py-3 shadow-[0_10px_30px_rgba(37,99,235,0.15)]">
              <span class="h-2.5 w-2.5 rounded-full bg-sky-300"></span>
              <span class="truncate text-sm font-medium">Baidu 首页</span>
              <button class="ml-auto text-slate-300">×</button>
            </div>
            <div class="flex min-w-[220px] max-w-[260px] items-center gap-3 rounded-t-2xl border border-white/10 bg-white/5 px-4 py-3">
              <span class="h-2.5 w-2.5 rounded-full bg-slate-500"></span>
              <span class="truncate text-sm">Example Domain</span>
              <button class="ml-auto text-slate-400">×</button>
            </div>
          </div>
          <button class="h-11 w-11 rounded-2xl border border-white/10 bg-white/5 text-xl">+</button>
        </div>

        <div class="mt-3 flex items-center gap-3 rounded-2xl border border-white/10 bg-slate-900/80 p-3 shadow-[0_12px_40px_rgba(15,23,42,0.35)]">
          <div class="flex items-center gap-2">
            <button class="h-11 w-11 rounded-2xl border border-white/10 bg-white/5">←</button>
            <button class="h-11 w-11 rounded-2xl border border-white/10 bg-white/5">→</button>
            <button class="h-11 w-11 rounded-2xl border border-white/10 bg-white/5">↻</button>
          </div>
          <div class="rounded-full border border-emerald-400/20 bg-emerald-400/10 px-4 py-2 text-xs text-emerald-300">当前站点 · example.com</div>
          <div class="flex flex-1 items-center rounded-2xl border border-white/10 bg-slate-950/80 px-4 shadow-inner shadow-black/20">
            <span class="mr-3 text-slate-500">🔎</span>
            <input value="https://example.com/" class="h-11 flex-1 bg-transparent text-sm outline-none" />
          </div>
          <button class="h-11 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 px-6 text-sm font-semibold shadow-[0_12px_30px_rgba(37,99,235,0.35)]">打开</button>
          <div class="min-w-[160px] text-right text-xs text-slate-400">已就绪 · 2 个标签</div>
        </div>
      </div>

      <div class="h-[calc(100vh-170px)] bg-white"></div>
    </div>
  </body>
</html>
