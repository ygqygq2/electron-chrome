<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="electron-chrome">
  <defs>
    <linearGradient id="ec-ring" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60c8f8"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <radialGradient id="ec-orbit" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#60c8f8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#90d8ff" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="ec-nucleus" cx="38%" cy="35%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#60c8f8"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="27" stroke="url(#ec-ring)" stroke-width="2.5"/>
  <ellipse cx="32" cy="32" rx="27" ry="10.5"
           stroke="url(#ec-orbit)" stroke-width="1.8"
           transform="rotate(-38 32 32)"/>
  <circle cx="32" cy="32" r="7.5" fill="url(#ec-nucleus)"/>
  <circle cx="53" cy="15" r="3" fill="#90d8ff"/>
</svg>
